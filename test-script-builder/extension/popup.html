<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Test Script Builder</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>

<!-- Header -->
<div class="header">
    <div class="header-logo">
        <span class="logo-icon">🧪</span>
        <span class="logo-text">Test Script Builder</span>
    </div>
    <button class="icon-btn" id="settingsToggle" title="API Key Settings">⚙️</button>
</div>

<!-- API Key Panel -->
<div class="settings-panel" id="settingsPanel">
    <label class="settings-label">Claude API Key</label>
    <div class="api-key-row">
        <input type="password" id="apiKeyInput" placeholder="sk-ant-api03-..." autocomplete="off">
        <button class="btn btn-save" id="saveKeyBtn">Save</button>
    </div>
    <p class="settings-hint">Your key is stored locally in this browser only.</p>
</div>

<!-- Controls -->
<div class="controls">
    <button class="btn btn-record" id="recordBtn">● Start Recording</button>
    <button class="btn btn-process" id="processBtn" disabled>🤖 Generate Steps</button>
    <button class="btn btn-export" id="exportBtn" disabled>📥 Export CSV</button>
    <button class="btn btn-clear"  id="clearBtn">🗑 Clear</button>
</div>

<!-- Status Bar -->
<div class="status-bar" id="statusBar">Ready — click Start Recording to begin.</div>

<!-- Progress Bar -->
<div class="progress-wrap" id="progressWrap">
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    <span class="progress-label" id="progressLabel"></span>
</div>

<!-- Steps Table -->
<div class="table-wrap" id="tableWrap">
    <table class="steps-table">
        <thead>
            <tr>
                <th class="col-num">#</th>
                <th class="col-detail">Step Detail</th>
                <th class="col-expected">Expected Result</th>
                <th class="col-del"></th>
            </tr>
        </thead>
        <tbody id="stepsBody">
            <tr class="empty-row">
                <td colspan="4">No steps yet — record your actions, then click Generate Steps.</td>
            </tr>
        </tbody>
    </table>
</div>

<script src="popup.js"></script>
</body>
</html>
